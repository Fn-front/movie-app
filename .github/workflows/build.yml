name: Build

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Get date info
        id: date
        run: |
          echo "week=$(date +%Y-%V)" >> $GITHUB_OUTPUT

      - name: cache-node-modules
        uses: actions/cache@v4
        id: node_modules_cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: cache-nextjs-build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-

      - name: npm-install
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: app-build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Clear old cache
        run: |
          find .next/cache -type f -mtime +30 -delete 2>/dev/null || true
