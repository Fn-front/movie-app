name: Build

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Get date info
        id: date
        run: |
          echo "week=$(date +%Y-%V)" >> $GITHUB_OUTPUT

      - name: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        id: node_modules_cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      # ⚠️ キーにソースのハッシュを入れないのは意図的（#1082）。
      # `.next/cache` はコンパイル結果をコンテンツアドレスで持つので、
      # ブランチ間で共有しても誤ったチャンクを再利用しない。詳細は e2e.yml に。
      - name: cache-nextjs-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-

      - name: npm-install
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: npm ci

      # next/font/google の仮想モジュール解決が非決定的に失敗することがあるため
      # リトライを挟む。詳細は scripts/ci-build-with-retry.sh と #787
      - name: app-build
        run: bash scripts/ci-build-with-retry.sh
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # ホーム（/）は静的プリレンダなので、**ビルド時に**公開中映画を
          # Supabase から取る（#1115）。無いと `Supabase environment
          # variables are not defined` でビルドが落ちる。
          #
          # ⚠️ **この2つは NEXT_PUBLIC_* だが、いま参照しているのはサーバー側
          #    だけ**（`helpers/supabase.ts` の createAnonClient と
          #    `nowShowing.server.ts`）。クライアントバンドルには入っていない
          #    （`.next/static` に supabase の文字列が出ないことを実測で確認）。
          #    接頭辞だけを根拠に「どうせ公開値だから」と扱わないこと。
          #    クライアントから参照し始めた時点でブラウザへ出る
          # ⚠️ Dependabot が起動した run は専用ストアだけを見る。
          #    追加・削除はそちらにも反映すること（.claude/rules/ci-secrets.md）
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ホーム（/）が動的（ƒ）に戻っていないかをビルド出力で確かめる。
      # 単体テストは page.tsx の中身しか見られないため、配下のコンポーネントで
      # cookie を読まれると素通りする（#1115）
      - name: assert-static-routes
        run: node scripts/assert-static-routes.mjs

      - name: Clear old cache
        run: |
          find .next/cache -type f -mtime +30 -delete 2>/dev/null || true
