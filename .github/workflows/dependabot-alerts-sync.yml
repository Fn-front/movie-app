name: Dependabot Alerts Sync

# 毎日 03:00 JST（18:00 UTC）に Dependabot alerts を Issue へ同期する。
# 新規 alert は自動起票し、resolved（fixed / dismissed）になった alert の対応 Issue は自動クローズする。

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  vulnerability-alerts: read

jobs:
  sync:
    name: Sync Dependabot alerts to issues
    runs-on: ubuntu-latest
    steps:
      - name: Sync alerts to issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const LABEL = 'dependabot-alert';

            // ラベルが未作成なら作る（idempotent）
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'b60205',
                  description: 'Dependabot alert tracker (auto-generated by workflow)',
                });
                core.info(`Created label: ${LABEL}`);
              } else {
                throw e;
              }
            }

            // 全 alert を取得（state を問わず）
            const alerts = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            core.info(`Fetched ${alerts.length} alerts`);

            // 既存トラッカー Issue を取得（open + closed）
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              labels: LABEL,
              state: 'all',
              per_page: 100,
            });
            core.info(`Fetched ${issues.length} existing tracker issues`);

            // タイトルの `[Dependabot #<n>]` マーカーで alert 番号 → Issue のマップを作る
            const issueByAlertNum = new Map();
            for (const issue of issues) {
              const m = issue.title.match(/\[Dependabot #(\d+)\]/);
              if (m) {
                issueByAlertNum.set(parseInt(m[1], 10), issue);
              }
            }

            const severityToPriority = (sev) =>
              sev === 'critical' || sev === 'high' ? 'P1: important' : 'P2: nice-to-have';

            // 新規 open alert を起票 / 既存 closed Issue に対応する alert が再度 open に戻ったら再オープン
            let created = 0;
            let reopened = 0;
            for (const alert of alerts) {
              if (alert.state !== 'open') continue;

              const existingIssue = issueByAlertNum.get(alert.number);
              if (existingIssue) {
                if (existingIssue.state === 'closed') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    body: `Dependabot alert #${alert.number} が再度 \`open\` に戻ったため Issue を再オープン。`,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    state: 'open',
                  });
                  reopened += 1;
                  core.info(`Reopened issue #${existingIssue.number} (alert #${alert.number} → open)`);
                }
                continue;
              }

              const pkg = alert.dependency.package.name;
              const eco = alert.dependency.package.ecosystem;
              const adv = alert.security_advisory;
              const vuln = alert.security_vulnerability;
              const sev = adv.severity;
              const patched = vuln.first_patched_version?.identifier ?? 'N/A';
              const cve = adv.cve_id ?? 'N/A';

              const title = `[Dependabot #${alert.number}] ${pkg}: ${adv.summary}`;
              const body = [
                '## 概要',
                `Dependabot alert #${alert.number} を自動起票（by \`.github/workflows/dependabot-alerts-sync.yml\`）。`,
                '',
                '## 詳細',
                `- **Package**: \`${pkg}\` (${eco})`,
                `- **Severity**: ${sev}`,
                `- **GHSA**: [${adv.ghsa_id}](https://github.com/advisories/${adv.ghsa_id})`,
                `- **CVE**: ${cve}`,
                `- **影響バージョン**: \`${vuln.vulnerable_version_range}\``,
                `- **パッチバージョン**: \`${patched}\``,
                `- **Alert URL**: ${alert.html_url}`,
                '',
                '## 対応方針',
                `\`${pkg}\` を \`${patched}\` 以上に更新する。`,
                '',
                '---',
                '_このIssueは Dependabot alert が resolved になると自動でクローズされる。_',
              ].join('\n');

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [LABEL, 'security', severityToPriority(sev)],
                assignees: ['Fn-front'],
              });
              created += 1;
              core.info(`Created issue for alert #${alert.number} (${pkg}, ${sev})`);
            }

            // resolved alert の対応 Issue を自動クローズ
            const alertsByNumber = new Map(alerts.map((a) => [a.number, a]));
            const RESOLVED_STATES = new Set(['fixed', 'dismissed', 'auto_dismissed']);
            let closed = 0;
            for (const [alertNum, issue] of issueByAlertNum) {
              if (issue.state !== 'open') continue;
              const alert = alertsByNumber.get(alertNum);
              if (!alert) continue;
              if (!RESOLVED_STATES.has(alert.state)) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Dependabot alert #${alertNum} が \`${alert.state}\` になったため自動クローズ。`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              closed += 1;
              core.info(`Closed issue #${issue.number} (alert #${alertNum} → ${alert.state})`);
            }

            core.info(`Summary: created=${created}, reopened=${reopened}, closed=${closed}`);
