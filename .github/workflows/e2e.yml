name: E2E Test

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  push:
    branches:
      - main

# concurrency は設定しない。
#
# 以前は共有 Supabase DB でのテストデータ衝突を避けるため `group: e2e-shared-db` で
# リポ全体を直列化していた。しかし GitHub Actions は同一 concurrency group の pending を
# 1つしか保持せず、2つ目がキューに入ると古い pending を自動キャンセルする。ジョブが
# 1つも割り当てられないまま `cancelled` で終わるため、E2E が一度も実行されないまま
# PR をマージできていた（#793）。
#
# 衝突の原因だった固定の識別子（メールアドレス・movie_cache のID・送信元IP）は
# run 単位に分離した（e2e/helpers/runScope.ts）。直列化は不要になったため外す。
jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Get date info
        id: date
        run: echo "week=$(date +%Y-%V)" >> $GITHUB_OUTPUT

      - name: cache-node-modules
        uses: actions/cache@v4
        id: node_modules_cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: cache-nextjs-build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-${{ steps.date.outputs.week }}-

      - name: npm-install
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: get-playwright-version
        id: playwright_version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: cache-playwright-browsers
        uses: actions/cache@v4
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium

      - name: install-playwright-browsers
        if: ${{ steps.playwright_cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: install-playwright-deps
        if: ${{ steps.playwright_cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      - name: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: run-e2e-tests
        run: npm run test:e2e
        env:
          CI: true
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER }}
          # 二段階認証のE2Eで、DBの暗号文から共有鍵を復号してコードを計算する。
          # アプリ側（認証コードの検証）も同じ値を使う
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # 共有テストユーザーは run ごとに作って消すため、固定ユーザーの
          # 認証情報（旧 E2E_TEST_USER_EMAIL / _PASSWORD）は渡さない。
          # run の識別子に使う GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT は
          # Actions が既定で渡すため明示指定も不要（#793）。
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: 'true'

      - name: playwright-report-summary
        uses: daun/playwright-report-summary@v3
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          report-file: playwright-report/results.json

      - name: upload-playwright-report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: upload-test-results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
