name: Gemini PR Reviewer (Manual Trigger)

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/gemini-review' || startsWith(github.event.comment.body, '/gemini-review '))
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Post review-in-progress comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 Gemini AI レビューを開始しました。完了までしばらくお待ちください。\n\n[Workflow Run](${runUrl})`,
            });

      - name: Count review comments before
        id: before
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            return data.length;

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Gemini AI Code Reviewer
        id: gemini
        uses: truongnh1992/gemini-ai-code-reviewer@7c4b01afa073e48a44c72cdc1d010f9e3b95686f # v9.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash

      - name: Post review completion comment
        if: always()
        uses: actions/github-script@v7
        env:
          BEFORE_COUNT: ${{ steps.before.outputs.result }}
          GEMINI_CONCLUSION: ${{ steps.gemini.conclusion }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const conclusion = process.env.GEMINI_CONCLUSION;
            let body;
            if (conclusion === 'failure' || conclusion === 'cancelled') {
              body = `❌ Gemini AI レビュー失敗。詳細は [Workflow Run](${runUrl}) を確認してください。`;
            } else {
              const before = parseInt(process.env.BEFORE_COUNT || '0', 10);
              const { data } = await github.rest.pulls.listReviewComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              const newCount = data.length - before;
              if (newCount > 0) {
                body = `⚠️ Gemini AI レビュー完了: ${newCount}件の指摘あり。上のレビューコメントをご確認ください。`;
              } else {
                body = `✅ Gemini AI レビュー完了: 指摘なし 👍 コード上問題は見つかりませんでした。`;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
