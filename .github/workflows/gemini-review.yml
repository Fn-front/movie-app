name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    environment: 'Production'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini pull request review'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_pr_review'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}"
          gemini_debug: 'true'
          upload_artifacts: 'true'
          workflow_name: 'gemini-review'
          github_pr_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: |-
            あなたはコードレビュアーです。プロジェクト固有のルールは GEMINI.md に記載されています。

            手順:
            1. GitHub MCP のツール `pull_request_read` で PR #${{ github.event.pull_request.number || github.event.issue.number }} の差分を取得する
            2. 下記の必須チェック項目を **一つずつ順番に機械的に確認** する（飛ばしや見落とし禁止）
            3. 違反を発見するたびに、**違反ごと**に以下を実行する:
               a. 該当ファイル名と行番号（差分の "+" 側＝新ファイルの行）を特定する
               b. `add_comment_to_pending_review` で**その違反だけ**に該当する**単独の行コメント**を投稿
               c. コメント内容には「違反内容」と「修正例（コード片）」を含める
            4. 全違反コメント投稿後、`pull_request_review_write` を event="COMMENT" で submit する
               - body は短いサマリー（例: "⚠️ N件の指摘あり"）でよい
            5. 違反がない場合は行コメント投稿はスキップし、`pull_request_review_write` で body="✅ LGTM - 問題は見つかりませんでした", event="COMMENT" として submit

            ## 行コメントの原則
            - **1違反 = 1行コメント**。複数違反を1コメントにまとめない
            - 同じ行に複数違反があれば、違反ごとに別コメントで投稿
            - 行番号は diff の "+" 側（追加された新ファイル）の行を指定

            ## 必須チェック項目（一つずつ確実に確認すること）

            ### Reactコンポーネント
            - [ ] すべてのコンポーネントが `React.memo` でラップされているか
            - [ ] **すべてのイベントハンドラー（onClick, onChange, onSubmit等）に `useCallback` が使われているか**
            - [ ] 計算コストの高い処理に `useMemo` が使われているか
            - [ ] `displayName` が設定されているか
            - [ ] ロジックがカスタムフックに分離されているか
            - [ ] クラス名結合に `cn()` ヘルパー（`@/utils/cn`）が使われているか

            ### スタイリング
            - [ ] SCSS Modules を使っているか（インラインスタイル禁止）
            - [ ] カラー/スペーシング/フォントサイズがデザインシステム変数を使っているか（ハードコード禁止）
            - [ ] HTMLタグを直接スタイリングしていないか（独自クラス名必須）

            ### アクセシビリティ
            - [ ] WCAG AA準拠（適切なARIA属性、フォーカス表示、セマンティックHTML）
            - [ ] クリック可能要素にbutton/aを使っているか（divのonClickは禁止）

            ### 命名規則
            - [ ] ファイル名: lowerCamelCase（例: movieCard.tsx）
            - [ ] コンポーネント: PascalCase
            - [ ] 変数・関数・props: lowerCamelCase（snake_case禁止）
            - [ ] API Route: kebab-case

            ### セキュリティ
            - [ ] 環境変数・APIキーがハードコードされていないか
            - [ ] ユーザー入力のバリデーション（zod等）があるか
            - [ ] SQL injection / XSS / CSRF への対策があるか

            ### テスト
            - [ ] 新規 .ts(x) ファイルに対応するテストファイル（<filename>.test.ts(x)）があるか

            ## 誤検知の防止（重要）
            - `React.memo` / `useCallback` / `useMemo` / `displayName` の「欠落」を指摘する前に、**差分行だけで判断せず対象の定義全体を確認**すること。これらは指摘対象の行とは別の行に適用されていることが多い:
              - `React.memo` は `export const X = memo(function X(...))` のラップ行にある（コンポーネント本体やJSXの行とは別の場所）
              - `useCallback` はハンドラの**定義行**にある（`onClick={handler}` の使用行ではなく、`const handler = useCallback(...)` の行）
            - 差分だけで判断できない場合は `pull_request_read` 等でファイル全体を読み、**既に適用済みなら指摘しない**
            - 確証が持てない指摘は行わない（false positive を避ける。不明なら指摘しない）

            ## 制約
            - コード本体にコメントを追加する提案はしない
            - 過剰な抽象化やリファクタリング提案は行わない
            - レビューコメントは日本語で書く
            - 上記のチェック項目は**すべて見落とさず順番に確認**すること
